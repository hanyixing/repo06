# 资源限制(deploy.resources.limits)由 Docker Compose v2(`docker compose`)与 Swarm 生效；
# 如使用旧版 docker-compose(v1)，可改用 mem_limit / cpus 等顶层键。
version: '3.8'

services:
  mysql:
    container_name: bbs-mysql
    image: mysql/mysql-server:5.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pybbs}
      # 该密码需与 application-docker.yml 中的 site.datasource_password 一致
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    expose:
      - "3306"
    volumes:
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
      - ./mysql/mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 512M
    restart: always

  server:
    container_name: bbs-server
    build: .
    image: pybbs:latest
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
    ports:
      - "${SERVER_PORT:-8080}:8080"
    # 应用启动时会建立数据源并执行 Flyway 迁移，必须等 MySQL 健康后再启动
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 512M
    restart: always
