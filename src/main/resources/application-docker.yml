# ==============================================================================
# Docker environment configuration
# ==============================================================================
# Usage: spring.profiles.active=docker
# This profile is used when running inside Docker Compose

site:
  datasource_driver: com.mysql.cj.jdbc.Driver
  datasource_url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/pybbs?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  datasource_username: ${DB_USERNAME:root}
  datasource_password: ${DB_PASSWORD:root}

logging:
  level:
    root: INFO
    co.yiiu: INFO
